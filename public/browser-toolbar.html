<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #1e1e2e;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    color: #cdd6f4;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-app-region: drag;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: #1e1e2e;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
    height: 42px;
  }

  .nav-btn {
    -webkit-app-region: no-drag;
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: #6c7086;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s ease;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.08); color: #cdd6f4; }
  .nav-btn:active { background: rgba(255,255,255,0.12); transform: scale(0.95); }
  .nav-btn.disabled { opacity: 0.3; pointer-events: none; }

  .url-container {
    -webkit-app-region: no-drag;
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }

  .url-input {
    width: 100%;
    height: 28px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    color: #cdd6f4;
    font-size: 12px;
    padding: 0 10px 0 28px;
    outline: none;
    transition: all 0.2s ease;
  }
  .url-input:focus {
    background: rgba(255,255,255,0.1);
    border-color: rgba(137, 180, 250, 0.4);
    box-shadow: 0 0 0 2px rgba(137, 180, 250, 0.1);
  }
  .url-input::selection { background: rgba(137, 180, 250, 0.3); }

  .url-icon {
    position: absolute;
    left: 8px;
    font-size: 11px;
    pointer-events: none;
    z-index: 1;
  }

  .progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, #89b4fa, #b4befe);
    border-radius: 0 0 0 0;
    transition: width 0.3s ease;
    width: 0%;
    opacity: 0;
  }
  .progress-bar.loading {
    opacity: 1;
    animation: progress-pulse 1.5s ease-in-out infinite;
  }
  @keyframes progress-pulse {
    0% { width: 10%; }
    50% { width: 70%; }
    100% { width: 90%; }
  }
  .progress-bar.done {
    width: 100% !important;
    opacity: 0;
    transition: width 0.2s ease, opacity 0.4s ease 0.2s;
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button class="nav-btn disabled" id="btn-back" title="Back">‹</button>
    <button class="nav-btn disabled" id="btn-forward" title="Forward">›</button>
    <button class="nav-btn" id="btn-refresh" title="Refresh">↻</button>
    <div class="url-container">
      <span class="url-icon" id="url-icon">🔒</span>
      <input class="url-input" id="url-input" type="text" spellcheck="false" placeholder="Enter URL...">
    </div>
  </div>
  <div class="progress-bar" id="progress"></div>

  <script>
    const urlInput = document.getElementById('url-input');
    const btnBack = document.getElementById('btn-back');
    const btnForward = document.getElementById('btn-forward');
    const btnRefresh = document.getElementById('btn-refresh');
    const progress = document.getElementById('progress');
    const urlIcon = document.getElementById('url-icon');

    // Navigate on Enter
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let url = urlInput.value.trim();
        if (!url) return;
        if (!url.match(/^https?:\/\//)) {
          if (url.includes('.') && !url.includes(' ')) {
            url = 'https://' + url;
          } else {
            url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
          }
        }
        window.novaBrowser.navigate(url);
        urlInput.blur();
      }
    });

    // Select all on focus
    urlInput.addEventListener('focus', () => urlInput.select());

    // Nav buttons
    btnBack.addEventListener('click', () => window.novaBrowser.goBack());
    btnForward.addEventListener('click', () => window.novaBrowser.goForward());
    btnRefresh.addEventListener('click', () => window.novaBrowser.refresh());

    // Listen for updates from main process
    window.novaBrowser.onUrlChanged((url) => {
      urlInput.value = url;
      urlIcon.textContent = url.startsWith('https://') ? '🔒' : '🔓';
    });

    window.novaBrowser.onLoadingChanged((loading) => {
      progress.className = 'progress-bar' + (loading ? ' loading' : ' done');
    });

    window.novaBrowser.onNavStateChanged(({ canGoBack, canGoForward }) => {
      btnBack.classList.toggle('disabled', !canGoBack);
      btnForward.classList.toggle('disabled', !canGoForward);
    });
  </script>
</body>
</html>
